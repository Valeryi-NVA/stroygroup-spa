databases:
  - name: nva-crm-db
    plan: free
    databaseName: nvacrm
    user: nvacrm

services:
  - type: web
    name: nva-crm
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run db:init && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nva-crm-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 22
