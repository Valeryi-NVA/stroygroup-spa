services:
  - type: web
    name: nva-crm
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run db:init && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 22
