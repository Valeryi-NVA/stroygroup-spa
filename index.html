<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NVA-CRM — управление компанией</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="logo">N</div>
        <div>
          <div class="brand-title">NVA-CRM</div>
          <div class="brand-sub">управление компанией</div>
        </div>
      </div>

      <div class="auth-tabs">
        <button type="button" id="tabLogin" class="active">Вход</button>
        <button type="button" id="tabRegister">Регистрация</button>
      </div>

      <form id="loginForm" class="auth-form" autocomplete="off" novalidate>
        <label class="fld">Телефон
          <input type="tel" id="loginPhone" placeholder="+7 900 000-00-00" autocomplete="username">
        </label>
        <label class="fld">Пароль
          <input type="password" id="loginPass" autocomplete="current-password">
        </label>
        <div id="loginError" class="auth-error" role="alert"></div>
        <button type="submit" class="btn primary">Войти</button>
        <div class="auth-hint">Войдите в рабочее пространство вашей компании.</div>
      </form>

      <form id="registerForm" class="auth-form" autocomplete="off" hidden novalidate>
        <label class="fld">Телефон
          <input type="tel" id="regPhone" placeholder="+7 900 123-45-67">
        </label>
        <label class="fld">ФИО
          <input type="text" id="regName" placeholder="Иванов Иван Иванович">
        </label>
        <label class="fld">Название компании
          <input type="text" id="regTenant" placeholder="Например, NVA Строй">
        </label>
        <label class="fld">Пароль (не менее 8 символов)
          <input type="password" id="regPass" placeholder="Не менее 8 символов" autocomplete="new-password">
        </label>
        <label class="fld">Повтор пароля
          <input type="password" id="regPass2" placeholder="Повторите пароль" autocomplete="new-password">
        </label>
        <div id="regError" class="auth-error" role="alert"></div>
        <button type="submit" class="btn primary">Зарегистрироваться</button>
        <div class="auth-hint">Регистрация создаст защищённое рабочее пространство компании. Пароль хранится только на сервере в защищённом виде.</div>
      </form>
    </div>
  </div>

  <div id="mainApp" hidden>
    <header class="topbar">
      <div class="brand">
        <div class="logo">N</div>
        <div>
          <div class="brand-title">NVA-CRM</div>
          <div class="brand-sub">управление компанией</div>
        </div>
      </div>
      <div class="user-chip">
        <div>
          <div class="user-name" id="userName">—</div>
          <div class="user-role" id="userRole">—</div>
        </div>
        <button class="btn ghost" type="button" id="themeToggle" aria-label="Переключить тему">Светлая тема</button>
        <button class="btn ghost" type="button" id="logoutBtn" title="Выйти">Выйти</button>
      </div>
    </header>
    <nav id="nav" class="tabs" aria-label="Разделы приложения"></nav>
    <main id="app"></main>
  </div>

  <dialog id="modal" aria-labelledby="dlgTitle">
    <div class="dlg-head" id="dlgTitle"></div>
    <div class="dlg-body" id="dlgBody"></div>
    <div class="dlg-foot">
      <button class="btn ghost" type="button" id="dlgCancel">Отмена</button>
      <button class="btn primary" type="button" id="dlgSave">Сохранить</button>
    </div>
  </dialog>
</body>
</html>
